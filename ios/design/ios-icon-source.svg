<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#181233"/>
      <stop offset="100%" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff4ff"/>
      <stop offset="100%" stop-color="#4be9ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e8fd6"/>
      <stop offset="100%" stop-color="#155a9c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6fd6"/>
      <stop offset="100%" stop-color="#c8288f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <polygon points="512,240 712,352 512,464 312,352" fill="url(#top)"/>
    <polygon points="312,352 512,464 512,688 312,576" fill="url(#left)"/>
    <polygon points="712,352 512,464 512,688 712,576" fill="url(#right)"/>
  </g>

  <g opacity="0.9" stroke="#0a0714" stroke-width="6" fill="none" stroke-linejoin="round">
    <polygon points="512,240 712,352 512,464 312,352"/>
    <polygon points="312,352 512,464 512,688 312,576"/>
    <polygon points="712,352 512,464 512,688 712,576"/>
  </g>
</svg>
