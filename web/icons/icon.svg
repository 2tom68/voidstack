<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#141033"/>
      <stop offset="100%" stop-color="#05030f"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff4ff"/>
      <stop offset="100%" stop-color="#4be9ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e8fd6"/>
      <stop offset="100%" stop-color="#155a9c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6fd6"/>
      <stop offset="100%" stop-color="#c8288f"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="98" fill="none" stroke="#4be9ff" stroke-opacity="0.25" stroke-width="4"/>

  <g filter="url(#glow)">
    <!-- isometric cube: top / left / right faces -->
    <polygon points="256,120 356,176 256,232 156,176" fill="url(#top)"/>
    <polygon points="156,176 256,232 256,344 156,288" fill="url(#left)"/>
    <polygon points="356,176 256,232 256,344 356,288" fill="url(#right)"/>
  </g>

  <g opacity="0.9" stroke="#0a0714" stroke-width="3" fill="none" stroke-linejoin="round">
    <polygon points="256,120 356,176 256,232 156,176"/>
    <polygon points="156,176 256,232 256,344 156,288"/>
    <polygon points="356,176 256,232 256,344 356,288"/>
  </g>

  <circle cx="256" cy="232" r="196" fill="none" stroke="#4be9ff" stroke-opacity="0.18" stroke-width="2"/>
</svg>
